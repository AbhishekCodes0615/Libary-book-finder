<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Books — Library Book Finder</title>
  <link rel="stylesheet" href="mybooks.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>

<!-- Sidebar (same structure as catalogue page) -->
<div id="sidebar" class="sidebar" aria-label="Primary">
  <div>
    <h2> LIBRARY BOOK FINDER</h2>
    <ul>
      <li><a href="{{ url_for('dashboard') }}">Home</a></li>
      <li><a href="{{ url_for('catalogue') }}">Catalogue</a></li>
      <li class="active"><a href="{{ url_for('mybooks') }}">My Books</a></li>
      <li><a href="{{ url_for('aboutus') }}">About Us</a></li>
    </ul>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <span id="menuBtn" class="menu-icon" onclick="toggleMenu()" role="button" aria-controls="sidebar" aria-expanded="false" aria-label="Open menu">☰</span>
    <div class="search-box" role="search">
      <input id="mySearch" type="text" placeholder="Search my reserved books..." aria-label="Search my books">
    </div>
    <div class="logout">Logout </div>
  </div>

  <div class="catalogue-wrap" role="main">
    <div class="catalogue-header">
      <h2>My Books</h2>
      <div class="controls" role="region" aria-label="My books controls">
        <div id="reservedCount" style="font-weight:600; color:var(--green-dark);"></div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button id="clearAll" class="btn ghost" title="Un-reserve all">Un-reserve All</button>
        </div>
      </div>
    </div>

    <div id="myBooksGrid" class="books-grid" aria-live="polite">
      <!-- reserved book cards rendered here -->
    </div>

    <div id="myBooksEmpty" style="margin-top:20px;"></div>
  </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>


<script src="mybooks.js"></script>

<script>
(function(){
  // safe-get helpers
  const $ = id => document.getElementById(id);
  function ensureOverlay() {
    let ov = $('sidebarOverlay') || document.querySelector('.sidebar-overlay');
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'sidebarOverlay';
      ov.className = 'sidebar-overlay';
      ov.setAttribute('aria-hidden','true');
      document.body.appendChild(ov);
    }
    return ov;
  }

  const sidebar = $('sidebar') || document.querySelector('.sidebar');
  const menuBtn = $('menuBtn') || document.querySelector('.menu-icon');
  const overlay = ensureOverlay();

  // safety: if sidebar or button missing, log and stop
  if(!sidebar){
    console.warn('Menu fix: #sidebar element not found.');
    return;
  }
  if(!menuBtn){
    console.warn('Menu fix: #menuBtn/.menu-icon element not found.');
    return;
  }

  // ensure sidebar has hide class state on small screens
  function setInitial() {
    if(window.innerWidth > 992){
      sidebar.classList.remove('hide');
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden','true');
    } else {
      if(!sidebar.classList.contains('hide')) sidebar.classList.add('hide');
    }
  }

  // open/close functions
  function openSidebar(){
    sidebar.classList.remove('hide');
    overlay.classList.add('show'); overlay.setAttribute('aria-hidden','false');
    menuBtn.setAttribute('aria-expanded','true');
  }
  function closeSidebar(){
    sidebar.classList.add('hide');
    overlay.classList.remove('show'); overlay.setAttribute('aria-hidden','true');
    menuBtn.setAttribute('aria-expanded','false');
  }
  function toggleSidebar(){
    if(sidebar.classList.contains('hide')) openSidebar(); else closeSidebar();
  }

  // Attach a robust click handler using addEventListener (won't be overwritten by other code)
  menuBtn.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    toggleSidebar();
  }, {passive:false});

  // overlay click closes
  overlay.addEventListener('click', function(){ closeSidebar(); });

  // Escape closes
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeSidebar(); });

  // Keep responsive on resize
  window.addEventListener('resize', setInitial);

  // Expose safe toggle (won't overwrite if other toggle exists)
  if(typeof window.toggleMenu !== 'function'){
    window.toggleMenu = toggleSidebar;
  }

  // Kick initial state
  setInitial();

  // debug prints so you can check quickly
  console.log('Menu fix installed — menuBtn:', !!menuBtn, 'sidebar:', !!sidebar, 'overlay:', !!overlay);
})();
</script>

</body>
</html>
